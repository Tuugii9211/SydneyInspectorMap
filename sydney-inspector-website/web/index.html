<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sydney Inspector Map</title>
  <meta name="description" content="Community-reported public transport inspector sightings in Sydney, from the last 60 minutes." />
  <meta name="theme-color" content="#ff4444" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <h1>Sydney Inspector Map</h1>
    <span id="count" class="count">Loading…</span>
  </header>

  <div id="map" role="application" aria-label="Map of inspector reports"></div>

  <button id="reportBtn" class="report-btn">Add Report</button>

  <dialog id="confirm">
    <p>Report a transport inspector at your current location?</p>
    <div class="actions">
      <button id="cancelBtn" class="btn grey" type="button">Cancel</button>
      <button id="submitBtn" class="btn red" type="button">Submit</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
